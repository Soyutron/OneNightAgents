[project]
name = "onenightagents"
version = "0.1.0"
description = "ローカル LLM の Deep Agents 同士が遊ぶワンナイト人狼"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-ollama",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
onenightagents = "onenightagents.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
